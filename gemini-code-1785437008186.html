<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boinkers Auto Farm</title>
    <!-- TELEGRAM WEBAPP KÜTÜPHANESİ (ZORUNLU) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #0088cc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h2>Oto-Farm Başlatılıyor...</h2>
    <p>Lütfen bekleyin, Telegram oturumu doğrulanıyor.</p>

    <script>
        // Telegram WebApp Başlat
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Ekranı tam ekran yap

        // Bota onay verisini gönder ve pencereyi otomatik kapat
        setTimeout(() => {
            tg.sendData(JSON.stringify({ status: "start_farm", action: "boinkers_30min" }));
            tg.close();
        }, 1500);
    </script>
</body>
</html>
